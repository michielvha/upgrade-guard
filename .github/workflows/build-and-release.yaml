name: Binary & Container Release

permissions:
  id-token: write
  contents: write
  packages: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: latest

      - name: Test
        run: go test ./...

      - name: Tag with GitVersion
        id: gitversion
        uses: michielvha/gitversion-tag-action@8cf5869816cf71437052ac97d086e00526bf2d89 # v7.0.4
        with:
          configFilePath: gitversion.yml

      - name: Build and Release Go Binary
        uses: michielvha/goreleaser-action@99d53be595f6e73dbbd9adb136ea4c1cca86fe58 # v2.0.0
        with:
          github-token: ${{ github.token }}
          pgp-private-key: ${{ secrets.PGP_PRIVATE_KEY }}

      - name: Build and Push Docker Image
        uses: michielvha/docker-release-action@c499e52a1a05e5bdd8cf03ba19a423d4c7ec25e3 # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          project: ${{ github.event.repository.name }}
          version: ${{ steps.gitversion.outputs.semVer }}
          platforms: 'linux/amd64,linux/arm64'
          context: '.'
